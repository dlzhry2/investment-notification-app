name: Quality checks

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup python
      uses: actions/setup-python@v5

      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: './app/investment-notifier'
      run: pip install -r dev-requirements.txt
